name: Native

# The native Android app (docs/NATIVE.md): build, core tests, size budget. Runs only when it changes.
on:
  pull_request:
    paths: ['native/**', '.github/workflows/native.yml']
  push:
    branches: [main]
    paths: ['native/**', '.github/workflows/native.yml']

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Core tests
        run: ./gradlew :core:test --console=plain

      - name: Build (debug + shrunk release, debug-signed)
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:lintRelease --console=plain

      - name: Size budget
        run: ./scripts/check-size.sh
