name: Native

# The native Android app (docs/NATIVE.md): Rust core tests (incl. the golden fixtures shared with the
# web app), the Android build per CPU type, lint and the size budget. Runs when either side changes.
on:
  pull_request:
    paths: ['native/**', 'src/lib/**', '.github/workflows/native.yml']
  push:
    branches: [main]
    paths: ['native/**', 'src/lib/**', '.github/workflows/native.yml']

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NDK_VERSION: 28.2.13676358
  CARGO_NDK_VERSION: 4.1.2

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Rust toolchain (Android targets) and cargo-ndk
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
      - name: Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null

      - name: Rust core tests (golden fixtures from the web app)
        run: cargo test --manifest-path core-rs/Cargo.toml --locked

      - name: Build (debug + shrunk release per CPU type, debug-signed)
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:lintRelease --console=plain

      - name: Size budget
        run: ./scripts/check-size.sh
